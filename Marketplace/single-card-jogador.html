<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&family=Outfit:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/css/reset.css">
    <link rel="stylesheet" href="/css/configuracoes.css">
    <link rel="stylesheet" href="/css/geral.css">
    <link rel="stylesheet" href="/css/single-card-jogador.css">
    <title>Marketplace</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div class="card-mkt-place">
        <div class="sombra-imagem">
            <img src="./img/jogador.png" class="img-card-mkt">
        </div>
        <div class="info-card-mkt">
            <div class="textos-card-mkt">
                <h3>Nando Grana</h3>
                <h4>HALL OF FAME</h4>
                <span>Futsal</span>
            </div>
            <div class="numeros-info-card">
                <div class="qtd-info-card">
                    <p>Qtd: 120/250</p>
                </div>
                <div class="preco-info-card">
                    <p>10% ^</p>
                    <h4>R$ 365,66</h4>
                </div>
            </div>
        </div>
        <div class="btn-mkt">
            <button>VER PRODUTO</button>
            <button>+ ADICIONAR</button>
        </div>
    </div>
</body>
</html>
